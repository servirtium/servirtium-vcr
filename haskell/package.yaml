name:                servirtium-haskell
version:             2.0.0
github:              servirtium/servirtium-haskell
license:             MIT
author:              Servirtium contributors
maintainer:          paul@hammant.org
copyright:           MIT

synopsis:            Thin Haskell FFI wrapper over the Aether VCR record/replay core
category:            Testing, Web

extra-source-files:
- README.md
- CHANGELOG.md

description:         Please see the README on GitHub at <https://github.com/servirtium/servirtium-haskell#readme>

dependencies:
- base >= 4.11 && < 10

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  # Link against the native Aether VCR engine built by build-native.sh.
  extra-libraries: servirtium_vcr
  extra-lib-dirs: native

tests:
  servirtium-haskell-test:
    main:                Spec.hs
    source-dirs:         test
    # The test-suite also links the native engine directly.
    extra-libraries: servirtium_vcr
    extra-lib-dirs: native
    dependencies:
    - servirtium-haskell
    - hspec
    - http-client
    - bytestring
    - network
    - directory
    - filepath
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

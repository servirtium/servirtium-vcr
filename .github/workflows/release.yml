name: Release core binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, including prereleases
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Check release tag and version pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat SERVIRTIUM_VCR_VERSION)" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          # libfyaml: Aether releases after 0.889.0 build their runtime with it
          # (a working std.yaml, aether CHANGELOG), so linking against it needs it.
          sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev libnghttp2-dev libpcre2-dev libfyaml-dev

      # The fat Java jar needs a JDK >= 22 (FFM / Project Panama) + Maven, and the
      # multi-RID .NET nupkg needs the .NET SDK (dotnet pack). ubuntu-22.04 ships
      # neither at the version the binding packages require, so install both here.
      # Only these two multi-platform packages are built; nothing else is added.
      - name: Install JDK and Maven (for the fat Java jar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Install .NET SDK (for the multi-RID nupkg)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Install Node.js (for the multi-platform npm tarball)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned toolchains and FreeBSD sysroot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source release/toolchain.env
          tools="$RUNNER_TEMP/servirtium-toolchain"
          mkdir -p "$tools/aether" "$tools/aeb" "$tools/freebsd"
          fetch_asset() {
            local repo="$1" tag="$2" asset="$3" digest
            digest="$(gh api "repos/$repo/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$asset\") | .digest")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/$repo/releases/download/$tag/$asset" -o "$tools/$asset"
            printf '%s  %s\n' "${digest#sha256:}" "$tools/$asset" | sha256sum --check -
          }
          version="${AETHER_REF#v}"
          asset="aether-$version-linux-x86_64.tar.gz"
          fetch_asset aether-lang-dev/aether "$AETHER_REF" "$asset"
          tar -xzf "$tools/$asset" -C "$tools/aether"

          fetch_asset aether-lang-dev/aeb "$AEB_REF" aeb-linux-x86_64.tar.gz
          tar -xzf "$tools/aeb-linux-x86_64.tar.gz" -C "$tools/aeb"
          sh "$tools/aeb/aeb-linux-x86_64/install.sh" "$tools/prefix"

          asset="aether-$version-freebsd-x86_64-sysroot.tar.xz"
          fetch_asset aether-lang-dev/aether "$AETHER_REF" "$asset"
          tar -xJf "$tools/$asset" -C "$tools/freebsd" --strip-components=1
          test -f "$tools/freebsd/usr/include/stdio.h"

          asset="zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://ziglang.org/download/$ZIG_VERSION/$asset" -o "$tools/$asset"
          printf '%s  %s\n' "$ZIG_SHA256" "$tools/$asset" | sha256sum --check -
          tar -xJf "$tools/$asset" -C "$tools"
          test "$("$tools/zig-x86_64-linux-$ZIG_VERSION/zig" version)" = "$ZIG_VERSION"
          echo "$tools/aether/bin" >> "$GITHUB_PATH"
          echo "$tools/prefix/bin" >> "$GITHUB_PATH"
          echo "$tools/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          echo "AETHER_HOME=$tools/aether" >> "$GITHUB_ENV"
          echo "AETHER=$tools/aether/bin/ae" >> "$GITHUB_ENV"
          echo "AETHERC=$tools/aether/bin/aetherc" >> "$GITHUB_ENV"
          echo "AEB_HOME=$tools/prefix/share/aeb" >> "$GITHUB_ENV"
          echo "PREFIX=$tools/prefix" >> "$GITHUB_ENV"
          echo "AETHER_SYSROOT=$tools/freebsd" >> "$GITHUB_ENV"

      - name: Verify release version and toolchain pins
        run: SVCR_RELEASE_TAG="$RELEASE_TAG" SVCR_ARTIFACTS_MODE=version aeb release/.artifacts.ae

      - name: Build all nine libraries, nine ae-add packages, and the four binding packages
        env:
          TARGETS: x86_64-linux aarch64-linux x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos x86_64-windows aarch64-windows x86_64-freebsd
          # Widen the release for exactly the fat Java jar (6 natives) and the
          # multi-RID .NET nupkg (8 RIDs). All other HLL packages stay out of the
          # release (core + ae-add only — see release/README.md).
          RELEASE_BINDING_PACKAGES: '1'
        run: release/build.sh

      - name: Require the four multi-platform binding packages
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'release/dist/servirtium-vcr-*.jar' >/dev/null
          compgen -G 'release/dist/Servirtium.Vcr.*.nupkg' >/dev/null
          compgen -G 'release/dist/servirtium-vcr-*.tgz' >/dev/null
          test -s "release/dist/servirtium-vcr-swift-$RELEASE_TAG.artifactbundle.zip"

      - name: Verify release artifacts and Linux ABI
        run: SVCR_RELEASE_TAG="$RELEASE_TAG" SVCR_ARTIFACTS_MODE=bindings aeb release/.artifacts.ae

      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Cross-built libservirtium_vcr libraries for Linux, macOS, and Windows
          (x86_64 and arm64), plus Linux musl (x86_64 and arm64) and FreeBSD x86_64.
          Each library has a SHA256 checksum.

          All nine ae-add binary packages and aether.toml are included.
          GNU and musl Linux packages have distinct asset names; consumption
          requires Aether 0.838.0 or newer for libc-aware selection.

          Three ready-to-consume multi-platform binding packages are also attached:
          a fat Java jar (servirtium-vcr-*.jar) bundling the six glibc/macOS/Windows
          natives under /native/<os>-<arch>/, and a multi-RID .NET NuGet package
          (Servirtium.Vcr.*.nupkg) bundling all eight runtimes/<rid>/native/ libraries,
          and a multi-platform npm tarball (servirtium-vcr-*.tgz) bundling the same
          eight under native/<platform>-<arch>[-musl]/; install it with
          `npm install <this tarball's download URL>`.
          A SwiftPM artifact bundle (servirtium-vcr-swift-*.artifactbundle.zip) holds
          the core as static libraries for macOS arm64/x86_64 and Linux glibc
          x86_64/arm64; the repository's Package.swift downloads it, so
          `.package(url: "https://github.com/servirtium/servirtium-vcr", from: ...)`
          resolves this version (Swift 6.2 or newer) with no other step.
          Other language packages and registry publishing remain separate.

          All nine libraries built successfully. The Linux x86_64 library was
          loaded and checked for every declared C ABI export. This does not claim
          a record/playback test pass on every target platform.
          NOTES
          version_notes="release/notes/${RELEASE_TAG#v2.0.0-}.md"
          if [[ -f "$version_notes" ]]; then
            printf '\n' >> "$RUNNER_TEMP/release-notes.md"
            cat "$version_notes" >> "$RUNNER_TEMP/release-notes.md"
          fi
          # A re-run for a tag that is already released (a manual run after a
          # later step failed, e.g. a GitHub download 504) publishes nothing:
          # releases are immutable, and "Verify published downloads" below
          # re-checks every asset that is actually published.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::$RELEASE_TAG is already released; not re-publishing. The published assets are verified below."
            exit 0
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag "${flags[@]}" \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            release/dist/*.so release/dist/*.dylib release/dist/*.dll \
            release/dist/*.dll.lib release/dist/*.jar release/dist/*.nupkg release/dist/*.tgz \
            release/dist/*.artifactbundle.zip \
            release/dist/*.sha256 release/dist/SHA256SUMS.txt \
            release/dist/ae-add/servirtium_vcr-* release/dist/ae-add/aether.toml

      # The Go binding is a module in the go/ subdirectory, so `go get` resolves
      # versions from tags prefixed with the directory: go/<tag>. Point it at the
      # same commit as the release tag. (A go/v* tag does not match the `v*`
      # trigger above, so this cannot re-start the workflow.)
      - name: Tag the Go module (go/<tag>)
        run: |
          set -euo pipefail
          commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          gotag="go/$RELEASE_TAG"
          git fetch --tags --force --quiet
          if git rev-parse -q --verify "refs/tags/$gotag" >/dev/null; then
            test "$(git rev-parse "refs/tags/$gotag^{commit}")" = "$commit"
          else
            git tag "$gotag" "$commit"
            git push origin "refs/tags/$gotag"
          fi

      # SwiftPM: the root Package.swift downloads this release's Swift artifact
      # bundle as a binaryTarget(url:checksum:), so the manifest must carry the
      # bundle's checksum, and the bundle (not bit-reproducible) exists only
      # now. The checksum goes on a commit ON TOP of the release commit, tagged
      # with the bare semver tag (2.0.0-alpha.14, no "v"). SwiftPM reads
      # v2.0.0-alpha.14 and 2.0.0-alpha.14 as the same version and prefers the
      # tag without the "v", so `from:`/`exact:` resolve to this commit. No tag
      # is moved, nothing is force-pushed; the v<version> commit keeps an empty
      # checksum (its manifest falls back to the source form). The bare tag does
      # not match the `v*` trigger, and a GITHUB_TOKEN push starts no workflow.
      # The checksum is taken from the PUBLISHED asset, the bytes SwiftPM fetches.
      - name: Tag the Swift package (bare semver tag carrying the bundle checksum)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          swifttag="${RELEASE_TAG#v}"
          bundle="servirtium-vcr-swift-$RELEASE_TAG.artifactbundle.zip"
          published="$RUNNER_TEMP/swift-published"
          gh release download "$RELEASE_TAG" --pattern "$bundle" --dir "$published" --clobber
          sum="$(sha256sum "$published/$bundle" | cut -d' ' -f1)"
          echo "SWIFT_BUNDLE_SHA256=$sum" >> "$GITHUB_ENV"
          git fetch --tags --force --quiet
          if git rev-parse -q --verify "refs/tags/$swifttag" >/dev/null; then
            test "$(git rev-parse "refs/tags/$swifttag^{commit}^")" = "$commit"
            git show "refs/tags/$swifttag:Package.swift" | grep -qx "let binaryChecksum = \"$sum\""
            echo "$swifttag already carries the published bundle checksum."
            exit 0
          fi
          wt="$RUNNER_TEMP/swift-tag"
          git worktree add --detach "$wt" "$commit"
          cd "$wt"
          SVCR_RELEASE_TAG="$RELEASE_TAG" SVCR_SWIFT_CHECKSUM="$sum" aeb release/.version.ae
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Swift: artifact bundle checksum for $RELEASE_TAG" \
            -m "SwiftPM resolves $swifttag (this commit) in preference to $RELEASE_TAG (its parent)." \
            -- Package.swift
          test "$(git diff --name-only HEAD^ HEAD)" = "Package.swift"
          git tag "$swifttag"
          git push origin "refs/tags/$swifttag"

      # Carry the same checksum to main, so `branch: "main"` gets the released
      # binary too. Only while main's manifest still names this release (a later
      # release preparation wins), and retried if main moves under us.
      - name: Carry the Swift bundle checksum to main
        run: |
          set -euo pipefail
          wt="$RUNNER_TEMP/swift-main"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            rm -rf "$wt"; git worktree prune
            git worktree add --detach "$wt" origin/main
            cd "$wt"
            if ! grep -qx "let binaryTag = \"$RELEASE_TAG\"" Package.swift; then
              echo "::notice::main's Package.swift no longer names $RELEASE_TAG; left as is."
              exit 0
            fi
            if grep -qx "let binaryChecksum = \"$SWIFT_BUNDLE_SHA256\"" Package.swift; then exit 0; fi
            SVCR_RELEASE_TAG="$RELEASE_TAG" SVCR_SWIFT_CHECKSUM="$SWIFT_BUNDLE_SHA256" aeb release/.version.ae
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Swift: artifact bundle checksum for $RELEASE_TAG" -- Package.swift
            if git push origin HEAD:main; then exit 0; fi
            cd "$GITHUB_WORKSPACE"
          done
          echo "::error::could not push the Swift checksum to main; apply it with SVCR_RELEASE_TAG=$RELEASE_TAG SVCR_SWIFT_CHECKSUM=$SWIFT_BUNDLE_SHA256 aeb release/.version.ae"
          exit 1

      - name: Verify published downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/published-core"
          gh release download "$RELEASE_TAG" --dir "$downloaded"
          SVCR_RELEASE_TAG="$RELEASE_TAG" SVCR_ARTIFACTS_DIST="$downloaded" SVCR_ARTIFACTS_MODE=bindings aeb release/.artifacts.ae
          echo "Downloaded and verified all nine libraries, nine ae-add packages, the fat Java jar, the multi-RID .NET nupkg, the npm tarball, the Swift artifact bundle, checksums, and Linux ABI for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"

      # The whole point of the bare tag: a stranger's SwiftPM resolves this
      # version from GitHub, downloads the bundle, checks its checksum, links the
      # static core and replays the canonical tape. Needs Swift >= 6.2 (SE-0482
      # static-library artifact bundles); skipped with a warning without it.
      - name: Consume the Swift package by version from GitHub
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null; then
            echo "::warning::no swift on the runner; SwiftPM consumption of ${RELEASE_TAG#v} not checked"; exit 0
          fi
          v="$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -1)"
          case "$v" in 6.[2-9]*|[7-9].*) ;; *)
            echo "::warning::swift $v is older than 6.2; SwiftPM consumption of ${RELEASE_TAG#v} not checked"; exit 0 ;;
          esac
          c="$RUNNER_TEMP/swift-consumer"
          mkdir -p "$c/Sources/ConsumerExample" "$c/tapes"
          cp swift/example/Sources/ConsumerExample/main.swift "$c/Sources/ConsumerExample/"
          cp swift/example/tapes/single_get.md "$c/tapes/"
          printf '%s\n' '// swift-tools-version:5.9' 'import PackageDescription' 'let package = Package(' \
            '    name: "ConsumerExample",' \
            "    dependencies: [.package(url: \"https://github.com/$GH_REPO\", exact: \"${RELEASE_TAG#v}\")]," \
            '    targets: [.executableTarget(name: "ConsumerExample", dependencies: [' \
            '        .product(name: "Servirtium", package: "servirtium-vcr")])]' ')' > "$c/Package.swift"
          cd "$c"
          # GitHub's release-download URLs intermittently answer 504 (seen
          # 2026-11-09 on this very bundle), and SwiftPM does not retry. Retry
          # the whole resolve/build/run a few times before calling it a failure.
          ok=0
          for attempt in 1 2 3 4 5; do
            if env -u SERVIRTIUM_VCR_LIB_DIR swift run ConsumerExample; then ok=1; break; fi
            echo "::warning::swift run failed (attempt $attempt); retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          test "$ok" = 1
          grep -q "\"revision\" : \"$(git -C "$GITHUB_WORKSPACE" rev-parse "refs/tags/${RELEASE_TAG#v}^{commit}")\"" Package.resolved
          echo "SwiftPM resolved ${RELEASE_TAG#v} from GitHub and replayed the canonical tape." >> "$GITHUB_STEP_SUMMARY"

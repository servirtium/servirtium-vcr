name: Release Package

# Triggered by publishing a GitHub release tagged <Package>/v<semver>,
# e.g. Servirtium.Vcr/v2.0.0.
#
# Servirtium.Vcr bundles a native VCR library per RID (built from the Aether
# std VCR embedding module). A NuGet built on a single runner would be
# missing the other platforms' binaries, so this packs in two stages:
#   1. build-native — one runner per OS/arch builds its runtimes/<rid>/native lib
#   2. pack-and-push — collect every RID's lib, then `dotnet pack` + push
on:
  release:
    types: [published]

jobs:
  build-native:
    strategy:
      fail-fast: true
      matrix:
        # macos-14 = osx-arm64, macos-13 = osx-x64, ubuntu = linux-x64.
        # linux-arm64 and win-x64 are follow-ups (see README "Building").
        os: [ ubuntu-latest, macos-14, macos-13 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Aether
        uses: actions/checkout@v4
        with:
          repository: aether-lang-org/aether
          path: aether
      - name: Build & install the Aether toolchain
        run: |
          cd aether
          make -j$(getconf _NPROCESSORS_ONLN)
          sudo make install
          ae --version
      - name: Build the native VCR library
        run: AETHER_REPO="$PWD/aether" ./build-native.sh
      - name: Upload native lib
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: Servirtium.Vcr/runtimes/**/native/*
          if-no-files-found: error

  pack-and-push:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Pull every RID's native lib back into runtimes/ before packing.
      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect native libs into the project
        run: |
          mkdir -p Servirtium.Vcr/runtimes
          # Each artifact preserves the runtimes/<rid>/native/* subtree.
          find artifacts -path '*/runtimes/*' -type f | while read -r f; do
            rel="${f#*/runtimes/}"
            dest="Servirtium.Vcr/runtimes/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
          echo "Bundled native libs:"
          find Servirtium.Vcr/runtimes -type f

      - name: Extract version from ref
        uses: actions/github-script@v7
        id: extract-version
        with:
          script: |
            const matches = /refs\/tags\/(.+)\/v(.+)/.exec(context.ref);
            core.setOutput('package', matches[1]);
            core.setOutput('version', matches[2]);

      - name: Pack
        env:
          VERSION: ${{ steps.extract-version.outputs.version }}
          PACKAGE: ${{ steps.extract-version.outputs.package }}
        run: dotnet pack ./${PACKAGE}/${PACKAGE}.csproj --configuration Release /p:Version=${VERSION} --output .

      - name: Push
        env:
          VERSION: ${{ steps.extract-version.outputs.version }}
          PACKAGE: ${{ steps.extract-version.outputs.package }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ${PACKAGE}.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_API_KEY}

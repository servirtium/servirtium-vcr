name: build-and-test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# The native VCR library is built from the Aether std VCR embedding module
# (std/http/server/vcr/embed.ae) with the Aether toolchain, then P/Invoked
# by the managed code. So each runner: builds the Aether toolchain, builds
# the native lib for its RID, then runs `dotnet test`.
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = arm64, macos-13 = x64. Windows native build (MSYS2)
        # is tracked separately — see README "Building".
        os: [ ubuntu-latest, macos-14, macos-13 ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout servirtium-dotnet
        uses: actions/checkout@v4

      - name: Checkout Aether
        uses: actions/checkout@v4
        with:
          repository: aether-lang-dev/aether
          path: aether

      - name: Build & install the Aether toolchain
        run: |
          cd aether
          make -j$(getconf _NPROCESSORS_ONLN)
          sudo make install
          ae --version

      - name: Build the native VCR library
        run: AETHER_REPO="$PWD/aether" ./build-native.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test --configuration Release

      - name: Upload native lib
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: Servirtium.Vcr/runtimes/**/native/*
          if-no-files-found: error

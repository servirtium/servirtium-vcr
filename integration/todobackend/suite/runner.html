<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TodoBackend spec — Servirtium VCR runner</title>
  <link rel="stylesheet" href="css/mocha.css" />
</head>
<body>
  <!-- The canonical TodoBackend JS spec (Mocha + Chai), vendored verbatim
       from todo-backend-js-spec, driven by our own runner.js so Selenium has
       a deterministic done-signal (window.__mochaDone) and a machine-readable
       result. The API root is taken from the query string, exactly as the
       upstream index.html does: runner.html?<apiRoot>. -->
  <section id="mocha"></section>

  <script src="js/lib/underscore.js"></script>
  <script src="js/lib/jquery.js"></script>
  <script src="js/lib/q.js"></script>
  <script src="js/lib/chai.js"></script>
  <script src="js/lib/chai-as-promised.js"></script>
  <script src="js/lib/mocha.js"></script>

  <script src="js/specs.js"></script>
  <script src="js/runner.js"></script>
</body>
</html>

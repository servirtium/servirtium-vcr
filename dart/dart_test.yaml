# The core/vcr.ae engine is handle-based: N independent VCR servers can run
# concurrently, one server per port, each keyed by its own handle — so this is
# NOT an engine limit. concurrency: 1 is a suite choice: it keeps these tests
# serial so the shared native library load and per-test ports stay simple and
# deterministic. Drop it if/when the suites are confirmed independent.
concurrency: 1

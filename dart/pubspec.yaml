name: servirtium
description: >-
  Record/replay for HTTP service tests in the Servirtium markdown tape format —
  a thin dart:ffi wrapper over the Aether VCR core. Works for Dart and Flutter.
version: 2.0.0
repository: https://github.com/servirtium/servirtium-dart

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0

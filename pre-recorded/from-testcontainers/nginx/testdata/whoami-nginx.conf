user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;
events { worker_connections  64; }
http {
    server {
        listen 80;
        location /whoami {
            default_type text/plain;
            return 200 "main nginx.conf";
        }
    }
}
